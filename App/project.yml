name: Veplika
options:
  bundleIdPrefix: ai.veplika
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_CFBundleDisplayName: Visualize Companion
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_NSMicrophoneUsageDescription: Used to talk with your digital companion by voice
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Used to turn your speech into text for your companion
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Used to reach the voice-call server on your local network during development
targets:
  Veplika:
    type: application
    platform: iOS
    sources:
      - path: Veplika
        excludes: ["Web/**"]
      - path: Veplika/Web
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.veplika.app
        INFOPLIST_FILE: Veplika/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
